<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Upload and Processing</title>
</head>
<body>
<h1>Upload a Video</h1>
<form action="http://127.0.0.1:5000/extract_audio" method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept="video/mp4">
    <input type="submit" value="Extract Audio">
</form>
</body>
</html>
